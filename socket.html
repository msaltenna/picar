<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>Pi Car Control</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: black;
      color: white;
      touch-action: none;
    }

    #live {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      display: none;
    }
    #liveCanvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none;
    }
    #webrtcVideo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none;
      background: black;
      object-fit: cover;
    }

    /* ── Status bar ──────────────────────────────────────────────────────────── */
    #statusBar {
      position: fixed;
      bottom: 15px; left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
      z-index: 100;
      pointer-events: none;
    }
    .status-col {
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 6px;
      padding: 4px 8px;
      line-height: 1.7;
      white-space: nowrap;
    }
    .status-col:empty { display: none; }

    /* ── Config modal ────────────────────────────────────────────────────────── */
    #configModal {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #configModal.open { display: flex; }
    .config-inner {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px 24px 16px;
      width: min(92vw, 480px);
      max-height: 90vh;
      overflow-y: auto;
    }
    .config-inner h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .config-inner h2 button {
      background: none; border: none;
      color: #888; font-size: 20px;
      cursor: pointer; padding: 0 4px;
      line-height: 1;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 16px;
      margin-bottom: 16px;
    }
    .config-col h3 {
      font-size: 11px;
      color: #888;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .config-col label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin: 5px 0;
      cursor: pointer;
      color: #ccc;
    }
    .config-col label input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: #2a7;
      cursor: pointer;
      flex-shrink: 0;
    }
    .config-section-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 12px 0 6px 0;
      border-top: 1px solid #333;
      padding-top: 12px;
    }
    .config-btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .config-btn-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
    }
    .config-btn-row label input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: #2a7;
      cursor: pointer;
    }
    .config-close-row {
      margin-top: 16px;
      text-align: center;
    }
    .config-close-row button {
      padding: 8px 28px;
      background: #2a7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ── Menu ────────────────────────────────────────────────────────────────── */
    #menuBtn {
      position: fixed; top: 10px; right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      border: none; color: white;
      padding: 8px 12px; font-size: 14px;
      border-radius: 5px; cursor: pointer;
    }
    #commandMenu {
      position: fixed; top: 50px; right: 10px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 5px; padding: 10px;
      display: none; z-index: 1000;
      min-width: 160px;
    }
    #commandMenu button {
      display: block; width: 100%;
      margin: 5px 0; padding: 6px 10px;
      background: #333; color: white;
      border: none; border-radius: 3px;
      cursor: pointer; font-size: 14px;
      text-align: left;
    }

    /* ── Orientation enable btn ──────────────────────────────────────────────── */
    #enableBtn {
      position: fixed; top: 10px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px; font-size: 16px;
      background-color: #444; color: white;
      border: none; border-radius: 5px;
      cursor: pointer; z-index: 1000;
    }

    /* ── Virtual joysticks ───────────────────────────────────────────────────── */
    .joystick-zone {
      position: fixed; bottom: 30px;
      width: 150px; height: 150px;
      z-index: 500; display: none;
    }
    #joystickLeft  { left: 30px; }
    #joystickRight { right: 30px; }
    .joystick-base {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      position: relative;
    }
    .joystick-thumb {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .joystick-label {
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 11px;
      color: #fff;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 6px;
      padding: 2px 8px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Keyboard hint ───────────────────────────────────────────────────────── */
    #keyboardHint {
      position: fixed; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px; border-radius: 8px;
      font-size: 14px; text-align: center;
      z-index: 100; display: none;
    }
    #keyboardHint kbd {
      display: inline-block;
      padding: 3px 7px; background: #555;
      border-radius: 3px; margin: 0 2px;
      font-family: monospace;
    }

    /* ── Button strip ────────────────────────────────────────────────────────── */
    #btnStrip {
      position: fixed; bottom: 190px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 600;
      pointer-events: none;
    }
    #btnStrip button {
      pointer-events: auto;
      padding: 5px 10px; font-size: 11px; font-weight: bold;
      background: rgba(50,50,50,0.8); color: #aaa;
      border: 1.5px solid #555; border-radius: 6px;
      cursor: pointer; user-select: none;
      -webkit-user-select: none; white-space: nowrap; line-height: 1.2;
    }
    #btnStrip #shiftBtn.high    { background: rgba(0,160,80,0.8);  color: white; border-color: #0a6; }
    #btnStrip .tlock-btn.locked { background: rgba(200,120,0,0.8); color: white; border-color: #c80; }
    #btnStrip #lightBtn.lit     { background: rgba(240,200,40,0.9); color: #222;  border-color: #fc0; }
    @media (orientation: landscape) and (max-height: 500px) {
      #btnStrip { bottom: 8px; }
      #btnStrip button { padding: 4px 8px; font-size: 10px; }
    }

    /* ── Stream cert overlay ─────────────────────────────────────────────────── */
    /* ── Video modal ─────────────────────────────────────────────────────────── */
    .video-modal {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .video-modal.open { display: flex; }
    .vparam-grid {
      display: grid;
      grid-template-columns: 90px 1fr 60px;
      gap: 10px 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .vparam-grid label {
      font-size: 13px;
      color: #ccc;
    }
    .vparam-grid select,
    .vparam-grid input[type=range] {
      width: 100%;
      accent-color: #2a7;
    }
    .vparam-grid select {
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
    }
    .vval {
      font-size: 12px;
      color: #aaa;
      font-family: monospace;
      text-align: right;
    }

    #streamOverlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      z-index: 50; background: rgba(0,0,0,0.7);
    }
    #streamOverlay.hidden { display: none; }
    #enableStreamBtn {
      padding: 15px 30px; font-size: 18px;
      background: #2a7; color: white;
      border: none; border-radius: 8px; cursor: pointer;
    }
    #streamStatus {
      color: #aaa; font-size: 14px;
      margin-top: 10px; text-align: center;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <img id="live" src="" alt="">
  <canvas id="liveCanvas"></canvas>
  <video id="webrtcVideo" autoplay muted playsinline disablepictureinpicture></video>

  <!-- Status bar: 3 floating columns, bottom of screen -->
  <div id="statusBar">
    <div class="status-col" id="statusCol1"></div>
    <div class="status-col" id="statusCol2"></div>
    <div class="status-col" id="statusCol3"></div>
  </div>

  <button id="enableBtn" style="display:none;">Enable Orientation</button>
  <button id="menuBtn">☰</button>

  <div id="commandMenu">
    <button id="stopBtn" onclick="toggleStop()">Start</button>
    <button onclick="refreshPage()">Refresh Page</button>
    <button id="controlModeBtn" onclick="cycleControlMode()">Control: Auto</button>
    <button onclick="openConfig()">Config</button>
    <button onclick="openVideo()">Video</button>
  </div>

  <!-- Virtual joysticks -->
  <div id="joystickLeft" class="joystick-zone">
    <div class="joystick-base">
      <div class="joystick-thumb" id="thumbLeft"></div>
      <div class="joystick-label">Throttle</div>
    </div>
  </div>
  <div id="joystickRight" class="joystick-zone">
    <div class="joystick-base">
      <div class="joystick-thumb" id="thumbRight"></div>
      <div class="joystick-label">Steering</div>
    </div>
  </div>

  <!-- Button strip -->
  <div id="btnStrip">
    <button id="tlockFrontBtn" class="tlock-btn" style="display:none;">F.Diff: Open</button>
    <button id="shiftBtn" style="display:none;">Gear: LOW</button>
    <button id="tlockRearBtn" class="tlock-btn" style="display:none;">R.Diff: Open</button>
    <button id="lightBtn" style="display:none;">Light: OFF</button>
  </div>

  <!-- Stream cert overlay -->
  <div id="streamOverlay">
    <div>
      <button id="enableStreamBtn">Enable Video Stream</button>
      <div id="streamStatus">Checking stream server...</div>
    </div>
  </div>

  <!-- Keyboard hint -->
  <div id="keyboardHint">
    <kbd>W</kbd> / <kbd>↑</kbd> Forward &nbsp;
    <kbd>S</kbd> / <kbd>↓</kbd> Reverse<br>
    <kbd>A</kbd> / <kbd>←</kbd> Left &nbsp;
    <kbd>D</kbd> / <kbd>→</kbd> Right &nbsp;
    <kbd>Space</kbd> Stop<br>
    <kbd>G</kbd> Gear <span style="opacity:.6">(stops &amp; disarms first)</span>
  </div>

  <!-- Config modal -->
  <div id="configModal">
    <div class="config-inner">
      <h2>Config <button onclick="closeConfig()">✕</button></h2>

      <div class="config-grid">
        <div class="config-col">
          <h3>Status</h3>
          <label><input type="checkbox" id="cfgConnected"> Connected</label>
          <label><input type="checkbox" id="cfgControlMode"> Control mode</label>
          <label><input type="checkbox" id="cfgKeyboardHint"> Keyboard hint</label>
        </div>
        <div class="config-col">
          <h3>Network</h3>
          <label><input type="checkbox" id="cfgDown"> ↓ Bitrate (video)</label>
          <label><input type="checkbox" id="cfgUp"> ↑ (control)</label>
          <label><input type="checkbox" id="cfgFps"> FPS</label>
          <label><input type="checkbox" id="cfgLatency"> Latency</label>
          <label><input type="checkbox" id="cfgRes"> Resolution</label>
        </div>
        <div class="config-col">
          <h3>Feedback</h3>
          <label><input type="checkbox" id="cfgThrottle"> Throttle</label>
          <label><input type="checkbox" id="cfgSteering"> Steering</label>
          <label><input type="checkbox" id="cfgBattery"> Battery</label>
          <label><input type="checkbox" id="cfgRadio"> Radio / link</label>
          <label><input type="checkbox" id="cfgRails"> Board rails</label>
          <label><input type="checkbox" id="cfgCpu"> CPU / services</label>
        </div>
      </div>

      <div class="config-section-label">Buttons</div>
      <div class="config-btn-row">
        <label><input type="checkbox" id="cfgBtnGear"> Gear</label>
        <label><input type="checkbox" id="cfgBtnFrontDiff"> Front diff</label>
        <label><input type="checkbox" id="cfgBtnRearDiff"> Rear diff</label>
        <label><input type="checkbox" id="cfgBtnLight"> Light</label>
      </div>

      <div class="config-close-row">
        <button onclick="closeConfig()">Close</button>
      </div>
    </div>
  </div>

  <!-- Video params modal -->
  <div id="videoModal" class="video-modal">
    <div class="config-inner">
      <h2>Video <button onclick="closeVideo()">✕</button></h2>
      <p id="videoModalNote" style="font-size:12px;color:#888;margin:0 0 14px 0;"></p>

      <div class="vparam-grid">
        <label>Resolution</label>
        <select id="vpRes">
          <option value="320x240">320 × 240</option>
          <option value="480x360">480 × 360</option>
          <option value="640x480">640 × 480</option>
          <option value="1280x720">1280 × 720</option>
        </select>
        <span></span>

        <label>FPS</label>
        <input type="range" id="vpFps" min="5" max="30" step="5">
        <span id="vpFpsVal" class="vval"></span>

        <label id="vpBitrateLabel">Bitrate</label>
        <input type="range" id="vpBitrate" min="100" max="2000" step="50">
        <span id="vpBitrateVal" class="vval"></span>

        <label id="vpQualityLabel">Quality</label>
        <input type="range" id="vpQuality" min="5" max="50" step="5">
        <span id="vpQualityVal" class="vval"></span>
      </div>

      <div class="config-close-row" style="display:flex;gap:10px;justify-content:center;">
        <button onclick="applyVideo()" style="background:#2a7;">Apply</button>
        <button onclick="closeVideo()" style="background:#555;">Close</button>
      </div>
    </div>
  </div>

  <script>
    const hostname       = window.location.hostname;
    const legacyStreamBase = `https://${hostname}:8081`;
    const video          = document.getElementById('live');
    const socket         = io(`https://${hostname}:8443`, { secure: true });

    const enableBtn      = document.getElementById('enableBtn');
    const menuBtn        = document.getElementById('menuBtn');
    const commandMenu    = document.getElementById('commandMenu');
    const stopBtn        = document.getElementById('stopBtn');
    const controlModeBtn = document.getElementById('controlModeBtn');
    const keyboardHint   = document.getElementById('keyboardHint');
    const joystickLeftEl = document.getElementById('joystickLeft');
    const joystickRightEl= document.getElementById('joystickRight');
    const thumbLeft      = document.getElementById('thumbLeft');
    const thumbRight     = document.getElementById('thumbRight');
    const streamOverlay  = document.getElementById('streamOverlay');
    const enableStreamBtn= document.getElementById('enableStreamBtn');
    const streamStatusDiv= document.getElementById('streamStatus');
    const webrtcVideo    = document.getElementById('webrtcVideo');
    const statusCol1     = document.getElementById('statusCol1');
    const statusCol2     = document.getElementById('statusCol2');
    const statusCol3     = document.getElementById('statusCol3');
    const configModal    = document.getElementById('configModal');

    let stopped     = true;
    let wakeLock    = null;
    let isConnected = false;

    // ── Persistent config ─────────────────────────────────────────────────────
    const CFG_DEFAULTS = {
      showConnected:   true,
      showControlMode: false,
      showDown:        false,
      showUp:          false,
      showFps:         false,
      showLatency:     false,
      showRes:         false,
      showThrottle:    false,
      showSteering:    false,
      showBtnGear:     false,
      showBtnFrontDiff:false,
      showBtnRearDiff: false,
      showBtnLight:    true,
      showKeyboardHint:true,
      showBattery:     true,
      showRadio:       false,
      showCpu:         true,
      showRails:       false,
    };

    let uiCfg = { ...CFG_DEFAULTS };
    try {
      const saved = JSON.parse(localStorage.getItem('picar-config') || '{}');
      Object.assign(uiCfg, saved);
    } catch (_) {}

    function saveConfig() {
      localStorage.setItem('picar-config', JSON.stringify(uiCfg));
    }

    // ── Config modal ──────────────────────────────────────────────────────────
    const cfgCheckboxMap = {
      cfgConnected:    'showConnected',
      cfgControlMode:  'showControlMode',
      cfgDown:         'showDown',
      cfgUp:           'showUp',
      cfgFps:          'showFps',
      cfgLatency:      'showLatency',
      cfgRes:          'showRes',
      cfgThrottle:     'showThrottle',
      cfgSteering:     'showSteering',
      cfgBtnGear:      'showBtnGear',
      cfgBtnFrontDiff: 'showBtnFrontDiff',
      cfgBtnRearDiff:  'showBtnRearDiff',
      cfgBtnLight:     'showBtnLight',
      cfgKeyboardHint: 'showKeyboardHint',
      cfgBattery:      'showBattery',
      cfgRadio:        'showRadio',
      cfgCpu:          'showCpu',
      cfgRails:        'showRails',
    };

    function openConfig() {
      commandMenu.style.display = 'none';
      // Sync checkboxes to current config
      for (const [id, key] of Object.entries(cfgCheckboxMap)) {
        document.getElementById(id).checked = uiCfg[key];
      }
      configModal.classList.add('open');
    }

    function closeConfig() {
      // Read checkboxes into config and persist
      for (const [id, key] of Object.entries(cfgCheckboxMap)) {
        uiCfg[key] = document.getElementById(id).checked;
      }
      saveConfig();
      configModal.classList.remove('open');
      applyButtonVisibility();
      applyKeyboardHintVisibility();
      renderStatusBar();
    }

    function applyButtonVisibility() {
      document.getElementById('shiftBtn').style.display      = uiCfg.showBtnGear     ? '' : 'none';
      document.getElementById('tlockFrontBtn').style.display = uiCfg.showBtnFrontDiff ? '' : 'none';
      document.getElementById('tlockRearBtn').style.display  = uiCfg.showBtnRearDiff  ? '' : 'none';
      document.getElementById('lightBtn').style.display      = uiCfg.showBtnLight    ? '' : 'none';
    }

    function applyKeyboardHintVisibility() {
      keyboardHint.style.display =
        (controlMode === 'keyboard' && uiCfg.showKeyboardHint) ? 'block' : 'none';
    }

    // ── Status bar ────────────────────────────────────────────────────────────
    let liveStats = { downKbps: null, upKbps: null, fps: null, latencyMs: null, resW: null, resH: null };
    // Latest telemetry pushed by the server. null until the first message; each
    // sub-object is null when that source is unavailable or its reading is stale,
    // so the UI can show "--" rather than a last-known value dressed up as live.
    let telemetry = null;
    // Thresholds come from the server so the UI warns on the same rule the fleet
    // status bit uses. Percentage alone is not usable: it is null unless
    // BATT_CAPACITY is set on the flight controller.
    let telemetryCfg = { batteryWarnLevel: 20, batteryWarnVolts: null, batteryWarnOnNoReading: true };
    // When the last frame arrived, and how long a gap means "no longer live".
    let telemetryAt = 0;
    let telemetryStaleMs = 3000;

    // Staleness is checked on a timer, not only cleared by the disconnect handler.
    // Relying on the handler alone covers one of the two ways telemetry stops
    // arriving: it catches a dropped socket and misses a socket that stays up while
    // the server's publish loop dies. The second shape is worse than a blank bar,
    // because the last frame carried linkUp:true — so the UI renders 'FC: ok' beside
    // a plausible battery voltage for as long as the page stays open.
    //
    // To be accurate about which incident this does and does not cover: it is NOT the
    // 2026-08-03 MAVProxy wedge. There, picar's publish loop kept running and kept
    // emitting fresh frames whose heartbeat was stale, so 'FC: silent ⚠' is what
    // covers that one. This covers picar's own loop or event loop dying, which is
    // reachable today given the synchronous-work violations of invariant 9 still on
    // main. An earlier version of this comment claimed the wedge outright and was
    // wrong.
    //
    // Pure and argument-taking so it can be tested; the window is derived from the
    // server's own publish interval so a deliberately slow rover does not blank its
    // own bar.
    function telemetryExpired(t, at, staleMs, now) {
      return t !== null && (now - at) > staleMs;
    }

    // The rule above was pure and tested; its CALLER was an anonymous arrow inside a
    // setInterval, and deleting that whole block left the suite green — so both
    // reviewers were able to restore the original defect (a dead link rendering
    // 'FC: ok' beside an hours-old voltage, permanently) with nothing turning red.
    // A tested rule with an untestable caller is this branch's signature defect, and
    // it appeared in the commit written to eliminate it. Named and argument-taking so
    // the caller is a unit too.
    function telemetryExpiryTick(now) {
      if (!telemetryExpired(telemetry, telemetryAt, telemetryStaleMs, now)) return false;
      telemetry = null;
      renderStatusBar();
      return true;
    }

    function startTelemetryExpiryWatch(setIntervalFn) {
      return setIntervalFn(() => telemetryExpiryTick(Date.now()), 1000);
    }

    function renderStatusBar() {
      // Column 1: connection + control mode
      const c1 = [];
      if (uiCfg.showConnected)   c1.push(isConnected ? 'Connected' : 'Disconnected');
      if (uiCfg.showControlMode) c1.push(`Mode: ${controlMode}`);
      statusCol1.innerHTML = c1.join('<br>');

      // Column 2: network + fps
      const c2 = [];
      if (uiCfg.showDown)    c2.push(`↓ ${liveStats.downKbps !== null ? liveStats.downKbps + ' kbps' : '--'}`);
      if (uiCfg.showUp)      c2.push(`↑ ${liveStats.upKbps   !== null ? liveStats.upKbps   + ' kbps' : '--'}`);
      if (uiCfg.showFps)     c2.push(`FPS: ${liveStats.fps !== null ? liveStats.fps : '--'}`);
      if (uiCfg.showLatency) c2.push(`RTT: ${liveStats.latencyMs !== null ? liveStats.latencyMs + ' ms' : '--'}`);
      if (uiCfg.showRes)     c2.push(`Res: ${liveStats.resW ? liveStats.resW + '×' + liveStats.resH : '--'}`);
      statusCol2.innerHTML = c2.join('<br>');

      // Column 3: feedback
      const c3 = [];
      if (uiCfg.showThrottle) c3.push(`Thr: ${throttleValue.toFixed(2)}`);
      if (uiCfg.showSteering) c3.push(`Str: ${applyCurve(steeringValue).toFixed(2)}`);
      if (uiCfg.showBattery)  c3.push(formatBattery());
      if (uiCfg.showRadio)    c3.push(formatRadio());
      if (uiCfg.showRails)    c3.push(formatRails());
      // Always shown, not behind a uiCfg toggle: an operator must not be able to
      // hide the one indicator that distinguishes a live vehicle from a silent one.
      c3.push(formatFcLink());
      if (uiCfg.showCpu) {
        const host = formatHost();
        if (host) c3.push(host);
      } else {
        // Even with the field switched off, a rover that is ACTIVELY being limited or has a
        // dead service still says so. An operator can hide a number; they must not be able to
        // hide the condition that number exists to reveal — the same rule formatFcLink()
        // follows one line above.
        const urgent = formatHostUrgent();
        if (urgent) c3.push(urgent);
      }
      statusCol3.innerHTML = c3.join('<br>');
    }


    // ── Telemetry formatting ──────────────────────────────────────────────────
    //
    // Every one of these can legitimately be unavailable, and showing a stale or
    // invented value on a vehicle status display is worse than showing nothing. So
    // each returns an explicit "--" when the source is absent or stale.
    // CPU temperature and throttling, shown ONLY when it is worth an operator's attention:
    // the firmware says something is being limited right now, or the die is hot enough to be
    // heading there. A number that is always on screen is a number nobody reads.
    //
    // `null` from the rover means "could not determine" and is rendered as such — it is not
    // silently treated as cool, for the same reason the reader count distinguishes 0 from
    // unknown.
    // The always-visible reading: temperature, CPU busy, and any unit that is not active.
    // Colour escalates rather than appearing from nothing — an indicator that only exists
    // during a fault cannot be sanity-checked beforehand, which is how rover1 sat at 84 C for
    // an unknown length of time with every other field on this bar reading healthy.
    function formatHost() {
      const HOT_C = 75, WARM_C = 65;
      const h = telemetry && telemetry.host;
      if (!h) return '';
      const parts = [];
      // PERMANENT, every unit, every frame. Showing only what is broken means the line is
      // absent exactly when an operator wants to confirm things are fine — and it cannot be
      // sanity-checked before a fault, which is the same mistake the CPU reading made.
      //
      // `ok` is NOT `state === 'active'`. systemd reports a crash-looping unit as active, so a
      // service restarting every few seconds would render green. See unitHealth() in
      // host-health.js: sub-state, last exit result and a CLIMBING restart count all count
      // against it.
      const svc = h.services;
      if (svc) {
        const bits = Object.keys(svc).map((k) => {
          const u = svc[k] || {};
          // Full unit names, not abbreviations. This is a safety indicator read under
          // pressure; saving six characters is not worth an operator hesitating over whether
          // "mav" means mavproxy.
          if (u.ok) return '<span style="color:#9f9">' + k + '\u2713</span>';
          // Say WHAT is wrong, not just that something is. "mav:restart-looping" and
          // "mav:inactive" call for completely different responses.
          return '<span style="color:#f66">' + k + ':' + (u.why || '?') + '</span>';
        });
        parts.push('SVC ' + bits.join(' '));
      } else {
        // null means picar could not determine it — not that the services are fine.
        parts.push('<span style="color:#fc6">SVC --</span>');
      }
      const c = h.cpu || {};
      const t = c.tempC, busy = c.busyPct;
      const thr = h.throttled;
      const limited = thr && thr.active;
      // '--' rather than a number when unreadable. null means picar could not determine it,
      // which is not the same as cool or idle.
      const tempTxt = typeof t === 'number' ? t.toFixed(1) + '°C' : '--°C';
      const busyTxt = typeof busy === 'number' ? Math.round(busy) + '%' : '--%';
      let colour = '#9f9';
      if (limited || (typeof t === 'number' && t >= HOT_C)) colour = '#f66';
      else if (typeof t === 'number' && t >= WARM_C) colour = '#fc6';
      let line = '<span style="color:' + colour + '">CPU ' + tempTxt + ' ' + busyTxt + '</span>';
      // Name what is being limited: "THROTTLED" alone sends someone looking for a heat
      // problem when the firmware may be reporting under-voltage. rover1 had both.
      if (limited) line += '<span style="color:#f66"> — ' + thr.now.join(', ') + '</span>';
      parts.push(line);
      if (h.errors) {
        parts.push('<span style="color:#fc6">HEALTH? ' + Object.keys(h.errors).join(',') + '</span>');
      }
      return parts.join('<br>');
    }

    // The subset that is shown even when the operator has switched the CPU field off.
    function formatHostUrgent() {
      const h = telemetry && telemetry.host;
      if (!h) return '';
      const parts = [];
      const svc = h.services;
      if (svc) {
        const down = Object.keys(svc).filter((k) => !(svc[k] || {}).ok);
        if (down.length) {
          parts.push('<span style="color:#f66">SVC ' +
            down.map((k) => k + ':' + ((svc[k] || {}).why || '?')).join(' ') + '</span>');
        }
      }
      const thr = h.throttled;
      if (thr && thr.active) {
        const t = (h.cpu || {}).tempC;
        const tempTxt = typeof t === 'number' ? t.toFixed(1) + '°C' : '--°C';
        parts.push('<span style="color:#f66">CPU ' + tempTxt + ' — ' + thr.now.join(', ') + '</span>');
      }
      return parts.join('<br>');
    }

    function formatBattery() {
      const b = telemetry && telemetry.battery;
      if (!b) {
        // Fail closed, matching batteryTrouble() on the server. A missing or stale
        // battery entry while the LINK IS UP means something is talking and it is
        // not telling us about the pack — a dead pack and a dead monitor look
        // identical from here, and neither is an all-clear. A DOWN link is a
        // different fault, surfaced separately, so it does not warn here.
        //
        // This is the third review round to catch this file as the missed half of
        // the fail-closed fix: the server set the fleet status bit correctly while
        // this bar rendered a bare "Batt: --", so the dashboard flagged trouble the
        // operator looking at the vehicle could not see.
        //
        // See formatFcLink() for why "a down link is surfaced separately" is now
        // actually true of this file — it was not when that justification was written.
        const linkUp = !!(telemetry && telemetry.linkUp);
        const warnNoReading = telemetryCfg.batteryWarnOnNoReading !== false && linkUp;
        return warnNoReading ? 'Batt: -- ⚠' : 'Batt: --';
      }
      const parts = [];
      if (b.voltageV !== null && b.voltageV !== undefined) parts.push(`${b.voltageV.toFixed(1)}V`);
      // A leading ~ marks a percentage interpolated from voltage rather than
      // coulomb-counted by the flight controller. It is not decoration: a
      // voltage estimate sags under throttle, so an unmarked number would read as
      // a fuel gauge and a hard acceleration would look like a failing pack.
      if (b.remainingPct !== null && b.remainingPct !== undefined) {
        parts.push(`${b.pctSource === 'voltage' ? '~' : ''}${b.remainingPct}%`);
      }
      if (b.currentA !== null && b.currentA !== undefined) parts.push(`${b.currentA.toFixed(1)}A`);
      const text = parts.length ? parts.join(' ') : '--';
      const lowPct = b.remainingPct !== null && b.remainingPct !== undefined
        && b.remainingPct <= telemetryCfg.batteryWarnLevel;
      const lowV = telemetryCfg.batteryWarnVolts !== null && b.voltageV !== null
        && b.voltageV !== undefined && b.voltageV <= telemetryCfg.batteryWarnVolts;
      // Fail closed here too, matching batteryTrouble() on the server. The fleet
      // status bit already treated an unreadable monitor as trouble, but this bar
      // did not, so the operator looking at the vehicle saw a bare "Batt: --" with
      // no warning while the dashboard flagged it. A dead pack and a missing
      // monitor look identical from here, and neither is an all-clear.
      const noReading = telemetryCfg.batteryWarnOnNoReading !== false
        && (b.remainingPct === null || b.remainingPct === undefined)
        && (b.voltageV === null || b.voltageV === undefined);
      const low = lowPct || lowV || noReading;
      return low ? `Batt: ${text} ⚠` : `Batt: ${text}`;
    }

    // Board 5V rail and servo rail, from the flight controller's POWER_STATUS. A
    // servo rail at 0 V means nothing can actuate even when everything else looks
    // healthy, which is worth being able to see.
    function formatRails() {
      const p = telemetry && telemetry.power;
      if (!p) return 'Rails: --';
      return `Rails: ${p.boardV.toFixed(2)}V / ${p.servoV.toFixed(2)}V`;
    }

    // The flight-controller link, which had NO representation in the operator UI.
    //
    // That gap became concrete on 2026-08-03: MAVProxy wedged, picar streamed
    // overrides into a dead socket for over an hour, and every indicator on this
    // screen looked healthy — rails and battery simply read "--", which is
    // indistinguishable from "not fitted". The dashboard showed a fault the operator
    // could not see. A control station must be able to tell a live vehicle from a
    // silent one.
    //
    // Two distinct states, because they fail differently:
    //   linkUp false            — the TCP link to MAVProxy is down. picar knows.
    //   awaitingAutopilot true  — link up, but the autopilot has never identified
    //                             itself, so nothing has been confirmed by read-back.
    function formatFcLink() {
      if (!telemetry) return 'FC: --';
      // A driver that has no flight controller at all is not a flight controller that
      // has gone away. The four GPIO drivers report fcSupported:false and used to
      // render a permanent 'FC: DOWN ⚠' — a standing warning about a link the vehicle
      // was never built with, which trains the operator to ignore the indicator.
      if (telemetry.fcSupported === false) return 'FC: n/a';
      if (!telemetry.linkUp) return 'FC: DOWN ⚠';
      if (telemetry.awaitingAutopilot) return 'FC: no autopilot ⚠';
      if (telemetry.autopilotHeartbeat === false) return 'FC: silent ⚠';
      // A live link and a live heartbeat are NOT the same thing as a configured
      // vehicle, and this line said 'ok' for both. Invariant 7 requires read-back
      // confirmation of every EXPECTED_CRITICAL_PARAMS entry before arming; the
      // driver tracks exactly that and reports it here, and nothing rendered it.
      //
      // This is the incident this branch exists because of. FRAME_CLASS was being
      // pushed as 2 (Boat) on a rover and "verified" back as the wrong value, and
      // the status bar read 'FC: ok' throughout. The operator had no surface on
      // which that was visible. Fail closed: if the driver did not tell us about
      // params at all, that is not a pass either.
      const p = telemetry.params;
      if (!p) return 'FC: params unknown ⚠';
      const mismatched = Object.keys(p.mismatched || {}).length;
      if (mismatched) return `FC: ${mismatched} param mismatch ⚠`;
      const missing = (p.missing || []).length;
      if (missing) return `FC: ${missing} param unverified ⚠`;
      return 'FC: ok';
    }

    function formatRadio() {
      if (!telemetry) return 'Link: --';
      // A SiK telemetry radio, if one is fitted. Distinct from the Wi-Fi link.
      //
      // Every field is checked individually rather than selecting the object by
      // truthiness. The driver now drops a frame whose BOTH rssi fields are the 255
      // "invalid" sentinel, but a partially valid frame legitimately survives with
      // some fields null — and interpolating those printed the literal string
      // "Radio: null/null rem 42" while still suppressing the Wi-Fi reading, which is
      // the only measurement that is real on this vehicle. That was the same
      // untouched-consumer defect for the fourth review round running, in this file.
      const r = telemetry.radio;
      const usable = r && (r.rssi !== null || r.remRssi !== null);
      if (usable) {
        const n = (v) => (v === null || v === undefined ? '--' : v);
        return `Radio: ${n(r.rssi)}/${n(r.noise)} rem ${n(r.remRssi)}`;
      }
      // Otherwise report the Wi-Fi link that is actually carrying this session.
      const w = telemetry.wifi;
      if (w && (w.signalDbm !== null || w.qualityPct !== null)) {
        const bits = [];
        if (w.qualityPct !== null) bits.push(`${w.qualityPct}%`);
        if (w.signalDbm !== null) bits.push(`${w.signalDbm}dBm`);
        return `Link: ${bits.join(' ')}`;
      }
      return 'Link: --';
    }

    // ── Client-side stats ─────────────────────────────────────────────────────
    // Each stream mode sets activeStreamStats() → Promise<{downKbps, fps}>
    // ↑ (control) bytes are counted in sendControlValues() regardless of mode.
    let activeStreamStats = null;
    let statUpBytes       = 0;

    setInterval(async () => {
      if (activeStreamStats) {
        try {
          const s = await activeStreamStats();
          liveStats.downKbps  = s.downKbps;
          liveStats.fps       = s.fps;
          liveStats.latencyMs = s.latencyMs ?? null;
          liveStats.resW      = s.resW ?? null;
          liveStats.resH      = s.resH ?? null;
        } catch (_) {}
      }
      liveStats.upKbps = Math.round(statUpBytes * 8 / 1000);
      statUpBytes = 0;
      renderStatusBar();
    }, 1000);

    // ── Canvas helpers ────────────────────────────────────────────────────────
    const canvasEl  = document.getElementById('liveCanvas');
    const canvasCtx = canvasEl.getContext('2d');

    function syncCanvasSize() {
      canvasEl.width  = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    window.addEventListener('resize', syncCanvasSize);

    function drawToCanvas(source, w, h) {
      const cw = canvasEl.width, ch = canvasEl.height;
      const scale = Math.max(cw / w, ch / h);
      const dw = w * scale, dh = h * scale;
      canvasCtx.drawImage(source, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
    }

    // ── WebRTC stream ─────────────────────────────────────────────────────────
    let webrtcPc         = null;
    let webrtcSessionUrl = null;

    function webrtcWhepUrlFromConfig(cfg) {
      const protocol = cfg.protocol || 'https';
      const port     = cfg.port     || 8889;
      const path     = (cfg.path   || 'cam').replace(/^\/+/, '');
      return `${protocol}://${hostname}:${port}/${path}/whep`;
    }

    async function stopWebRTCStream() {
      activeStreamStats = null;
      if (webrtcSessionUrl) {
        try { await fetch(webrtcSessionUrl, { method: 'DELETE' }); } catch (_) {}
        webrtcSessionUrl = null;
      }
      if (webrtcPc) { try { webrtcPc.close(); } catch (_) {} webrtcPc = null; }
      webrtcVideo.srcObject = null;
    }

    function waitIceGatheringComplete(pc) {
      if (pc.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const timeout = setTimeout(done, 5000);
        function done() { clearTimeout(timeout); pc.removeEventListener('icegatheringstatechange', onSC); resolve(); }
        function onSC() { if (pc.iceGatheringState === 'complete') done(); }
        pc.addEventListener('icegatheringstatechange', onSC);
      });
    }

    async function setupWebRTCStream(cfg) {
      stopH264Stream();
      await stopWebRTCStream();
      hideAllVideoSurfaces();
      webrtcVideo.style.display = 'block';
      streamOverlay.classList.add('hidden');

      const whepUrl = cfg.url || webrtcWhepUrlFromConfig(cfg);
      const pc = new RTCPeerConnection({ iceServers: [] });
      webrtcPc = pc;
      pc.addTransceiver('video', { direction: 'recvonly' });

      pc.ontrack = (evt) => {
        if (evt.streams && evt.streams[0]) {
          webrtcVideo.srcObject = evt.streams[0];
          webrtcVideo.play().catch(() => {});
        }
      };

      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        console.log('WebRTC connection state:', s);
        if (s === 'failed') {
          console.log('WebRTC ICE failed — reconnecting in 3 s…');
          stopWebRTCStream().then(() => {
            if (pendingStreamCfg && pendingStreamCfg.codec === 'webrtc')
              setTimeout(() => setupWebRTCStream(pendingStreamCfg).catch(console.error), 3000);
          });
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGatheringComplete(pc);

      const res = await fetch(whepUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!res.ok) throw new Error(`WHEP offer failed: HTTP ${res.status}`);

      const location = res.headers.get('location');
      if (location) webrtcSessionUrl = new URL(location, whepUrl).toString();
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });

      // Stats via RTCPeerConnection.getStats() — inbound-rtp gives received bytes + frames
      let lastBytes  = 0;
      let lastFrames = 0;
      let statsInit  = false;
      activeStreamStats = async () => {
        if (!webrtcPc) return { downKbps: null, fps: null, latencyMs: null, resW: null, resH: null };
        const stats = await webrtcPc.getStats();
        let downKbps = null, fps = null, latencyMs = null, resW = null, resH = null;
        stats.forEach(r => {
          if (r.type === 'inbound-rtp' && r.kind === 'video') {
            if (statsInit) {
              downKbps = Math.round((r.bytesReceived  - lastBytes)  * 8 / 1000);
              fps      = r.framesDecoded - lastFrames;
            }
            lastBytes  = r.bytesReceived;
            lastFrames = r.framesDecoded;
            statsInit  = true;
            if (r.frameWidth)  resW = r.frameWidth;
            if (r.frameHeight) resH = r.frameHeight;
          }
          // RTT from the active ICE candidate pair — derived from STUN/RTCP the
          // connection already exchanges, so it costs no extra bandwidth.
          if (r.type === 'candidate-pair' && r.state === 'succeeded' &&
              r.currentRoundTripTime != null) {
            latencyMs = Math.round(r.currentRoundTripTime * 1000);
          }
        });
        return { downKbps, fps, latencyMs, resW, resH };
      };
    }

    // ── H264 WebSocket + WebCodecs stream ─────────────────────────────────────
    let h264Ws       = null;
    let videoDecoder = null;

    function stopH264Stream() {
      activeStreamStats = null;
      if (h264Ws) { try { h264Ws.onclose = null; h264Ws.close(); } catch (_) {} h264Ws = null; }
      if (videoDecoder && videoDecoder.state !== 'closed') { try { videoDecoder.close(); } catch (_) {} }
      videoDecoder = null;
    }

    function setupH264Stream(cfg) {
      hideAllVideoSurfaces();
      canvasEl.style.display = 'block';
      stopWebRTCStream();
      streamOverlay.classList.add('hidden');
      syncCanvasSize();

      if (!('VideoDecoder' in window)) {
        streamOverlay.classList.remove('hidden');
        enableStreamBtn.style.display = 'none';
        streamStatusDiv.innerHTML =
          'H.264 requires Chrome / Edge or iOS Safari 16.4+.<br>' +
          'Switch the server to MJPEG mode (<code>stream_codec: "mjpeg"</code>) or use a supported browser.';
        return;
      }

      let decoderReady = false;
      let decodeTs     = 0;
      const tsStep     = Math.round(1_000_000 / (cfg.fps || 30));

      let h264StatBytes  = 0;
      let h264StatFrames = 0;
      activeStreamStats = () => {
        const s = { downKbps: Math.round(h264StatBytes * 8 / 1000), fps: h264StatFrames };
        h264StatBytes = 0; h264StatFrames = 0;
        return Promise.resolve(s);
      };

      function parseSPSCodec(buf) {
        const u8 = new Uint8Array(buf);
        const h = n => n.toString(16).padStart(2, '0');
        for (let i = 0; i < u8.length - 4; i++) {
          if (u8[i]===0 && u8[i+1]===0 && u8[i+2]===0 && u8[i+3]===1) {
            if ((u8[i+4] & 0x1f) === 7 && i+7 < u8.length) return `avc1.${h(u8[i+5])}${h(u8[i+6])}${h(u8[i+7])}`;
          }
          if (u8[i]===0 && u8[i+1]===0 && u8[i+2]===1) {
            if ((u8[i+3] & 0x1f) === 7 && i+6 < u8.length) return `avc1.${h(u8[i+4])}${h(u8[i+5])}${h(u8[i+6])}`;
          }
        }
        return 'avc1.428028';
      }

      function initDecoder(codecStr) {
        if (videoDecoder && videoDecoder.state !== 'closed') { try { videoDecoder.reset(); } catch (_) {} }
        videoDecoder = new VideoDecoder({
          output: (frame) => {
            if (videoDecoder.decodeQueueSize > 2) { frame.close(); return; }
            drawToCanvas(frame, frame.codedWidth, frame.codedHeight);
            frame.close();
            h264StatFrames++;
          },
          error: (err) => { console.warn('VideoDecoder error:', err.message); decoderReady = false; },
        });
        try {
          videoDecoder.configure({
            codec: codecStr,
            codedWidth:  cfg.width  || 640,
            codedHeight: cfg.height || 480,
            hardwareAcceleration: 'prefer-hardware',
            optimizeForLatency: true,
          });
          decoderReady = true;
          console.log('VideoDecoder configured:', codecStr);
        } catch (e) { console.error('VideoDecoder configure error:', e); decoderReady = false; }
      }

      function connectWs() {
        if (h264Ws) { try { h264Ws.close(); } catch (_) {} }
        let keyframeReceived = false;
        let lastKfRequest    = 0;

        h264Ws = new WebSocket(`wss://${hostname}:8081/stream`);
        h264Ws.binaryType = 'arraybuffer';

        h264Ws.onopen = () => { console.log('H264 WS connected'); decodeTs = 0; keyframeReceived = false; };

        h264Ws.onmessage = (evt) => {
          const buf = evt.data;
          if (!(buf instanceof ArrayBuffer) || buf.byteLength < 5) return;
          h264StatBytes += buf.byteLength;

          const view  = new DataView(buf);
          const isKey = (view.getUint8(0) & 0x01) !== 0;
          const h264Data = buf.slice(5);

          if (!keyframeReceived) {
            if (!isKey) return;
            initDecoder(parseSPSCodec(h264Data));
            if (!decoderReady) return;
            keyframeReceived = true;
          }
          if (!decoderReady) {
            if (!isKey) return;
            initDecoder(parseSPSCodec(h264Data));
            if (!decoderReady) return;
            keyframeReceived = true;
          }
          if (!isKey && videoDecoder.decodeQueueSize > 2) return;

          try {
            videoDecoder.decode(new EncodedVideoChunk({
              type:      isKey ? 'key' : 'delta',
              timestamp: decodeTs,
              data:      h264Data,
            }));
            decodeTs += tsStep;
          } catch (e) {
            console.warn('Decode chunk error:', e);
            decoderReady = false; keyframeReceived = false;
            const now = Date.now();
            if (now - lastKfRequest > 5000 && h264Ws.readyState === WebSocket.OPEN) {
              lastKfRequest = now;
              h264Ws.send(JSON.stringify({ type: 'requestKeyframe' }));
            }
          }
        };

        h264Ws.onerror = () => console.warn('H264 WS error');
        h264Ws.onclose = () => {
          console.log('H264 WS closed — reconnecting in 2 s');
          decoderReady = false; keyframeReceived = false;
          setTimeout(connectWs, 2000);
        };
      }

      connectWs();
    }

    // ── MJPEG stream (fetch + ReadableStream for byte counting) ───────────────
    let mjpegAbort = null;

    function stopMjpegStream() {
      activeStreamStats = null;
      if (mjpegAbort) { mjpegAbort.abort(); mjpegAbort = null; }
    }

    async function setupMjpegStream() {
      stopH264Stream();
      await stopWebRTCStream();
      stopMjpegStream();
      hideAllVideoSurfaces();
      canvasEl.style.display = 'block';
      syncCanvasSize();
      streamOverlay.classList.add('hidden');

      mjpegAbort = new AbortController();
      let mjpegStatBytes  = 0;
      let mjpegStatFrames = 0;
      activeStreamStats = () => {
        const s = { downKbps: Math.round(mjpegStatBytes * 8 / 1000), fps: mjpegStatFrames };
        mjpegStatBytes = 0; mjpegStatFrames = 0;
        return Promise.resolve(s);
      };

      let buf = new Uint8Array(0);

      const pump = async () => {
        const res = await fetch(`${legacyStreamBase}/stream.mjpg`, { signal: mjpegAbort.signal });
        const reader = res.body.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          mjpegStatBytes += value.byteLength;

          // Append chunk to buffer
          const merged = new Uint8Array(buf.length + value.length);
          merged.set(buf); merged.set(value, buf.length);
          buf = merged;

          // Extract complete JPEGs (FF D8 ... FF D9)
          while (true) {
            let s = -1;
            for (let i = 0; i < buf.length - 1; i++) {
              if (buf[i] === 0xff && buf[i+1] === 0xd8) { s = i; break; }
            }
            if (s === -1) { buf = new Uint8Array(0); break; }
            if (s > 0) buf = buf.subarray(s);
            let e = -1;
            for (let i = 2; i < buf.length - 1; i++) {
              if (buf[i] === 0xff && buf[i+1] === 0xd9) { e = i + 1; break; }
            }
            if (e === -1) break;

            const jpeg = buf.slice(0, e + 1);
            buf = buf.subarray(e + 1);
            mjpegStatFrames++;

            // Decode and draw frame
            try {
              const bitmap = await createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' }));
              drawToCanvas(bitmap, bitmap.width, bitmap.height);
              bitmap.close();
            } catch (_) {}
          }
        }
      };

      pump().catch(e => {
        if (e.name === 'AbortError') return;
        console.warn('MJPEG fetch error:', e);
        setTimeout(setupMjpegStream, 2000);
      });
    }

    // ── Stream dispatch ───────────────────────────────────────────────────────
    function hideAllVideoSurfaces() {
      video.style.display = 'none';
      canvasEl.style.display = 'none';
      webrtcVideo.style.display = 'none';
    }

    function startStream(cfg) {
      streamHasStarted = true;
      if (cfg && cfg.codec === 'webrtc') {
        setupWebRTCStream(cfg).catch((err) => {
          console.warn('WebRTC setup failed:', err);
          streamOverlay.classList.remove('hidden');
          enableStreamBtn.style.display = 'inline-block';
          streamStatusDiv.textContent = 'WebRTC stream failed. Tap to retry video.';
        });
      } else if (cfg && cfg.codec !== 'mjpeg') {
        setupH264Stream(cfg);
      } else {
        setupMjpegStream();
      }
    }

    // ── Certificate acceptance flow ───────────────────────────────────────────
    let streamCertOk    = false;
    let pendingStreamCfg = null;
    let pendingProbeUrl  = null;
    let pendingOpenUrl   = null;
    let certPollTimer    = null;
    let streamHasStarted = false;

    const requestedStream = new URLSearchParams(window.location.search).get('stream');

    function normalizeStreamConfig(cfg) {
      if (requestedStream === 'mjpeg')  return { codec: 'mjpeg' };
      if (requestedStream === 'h264')   return { codec: 'avc1.42001f', width: cfg.width, height: cfg.height, fps: cfg.fps };
      if (requestedStream === 'webrtc') return { codec: 'webrtc', protocol: cfg.protocol, port: cfg.port, path: cfg.path, url: cfg.url };
      return cfg;
    }

    function setPendingStream(cfg) {
      pendingStreamCfg = normalizeStreamConfig(cfg);
      streamCertOk = false;
      if (pendingStreamCfg.codec === 'webrtc') {
        const c = pendingStreamCfg;
        const base = `${c.protocol || 'https'}://${hostname}:${c.port || 8889}/`;
        const camPath = (c.path || 'cam').replace(/^\/+/, '');
        pendingOpenUrl = `${base}${camPath}/`;
        pendingProbeUrl = base;
      } else {
        pendingOpenUrl = pendingProbeUrl = `${legacyStreamBase}/`;
      }
      checkStreamCert();
    }

    function checkStreamCert() {
      if (!pendingStreamCfg || !pendingProbeUrl) return;
      streamStatusDiv.textContent = 'Checking stream server...';
      enableStreamBtn.style.display = 'none';
      fetch(pendingProbeUrl, { mode: 'no-cors' })
        .then(() => { streamCertOk = true; if (pendingStreamCfg) startStream(pendingStreamCfg); })
        .catch(() => {
          // An already-trusted stream that briefly went away (e.g. a video-params
          // change just restarted MediaMTX, which takes a couple seconds to come
          // back): poll until it's reachable and reconnect automatically, rather
          // than dropping the user to the manual "enable" button.
          if (streamHasStarted) {
            streamStatusDiv.textContent = 'Reconnecting…';
            pollStreamCert();
          } else {
            streamStatusDiv.textContent = 'Tap below to enable the video stream';
            enableStreamBtn.style.display = 'inline-block';
          }
        });
    }

    function pollStreamCert() {
      if (certPollTimer) clearInterval(certPollTimer);
      let attempts = 0;
      certPollTimer = setInterval(() => {
        attempts++;
        if (streamCertOk || !pendingProbeUrl || attempts > 30) {
          clearInterval(certPollTimer); certPollTimer = null;
          if (!streamCertOk && attempts > 30) {
            streamStatusDiv.textContent = 'Stream unavailable — tap to retry.';
            enableStreamBtn.style.display = 'inline-block';
          }
          return;
        }
        fetch(pendingProbeUrl, { mode: 'no-cors' })
          .then(() => { clearInterval(certPollTimer); certPollTimer = null; streamCertOk = true; if (pendingStreamCfg) startStream(pendingStreamCfg); })
          .catch(() => {});
      }, 1000);
    }

    enableStreamBtn.addEventListener('click', () => {
      streamStatusDiv.textContent = 'Accept the certificate in the popup…';
      window.open(pendingOpenUrl || `${legacyStreamBase}/`, '_blank', 'width=480,height=360');
      pollStreamCert();
      window.addEventListener('message', function onMsg(e) {
        if (e.data === 'stream-cert-ok') {
          window.removeEventListener('message', onMsg);
          streamCertOk = true;
          if (pendingStreamCfg) startStream(pendingStreamCfg);
        }
      });
      setTimeout(() => {
        if (!streamCertOk && pendingStreamCfg && pendingStreamCfg.codec !== 'webrtc') {
          streamCertOk = true; startStream(pendingStreamCfg);
        }
      }, 5000);
    });

    socket.on('streamConfig', (cfg) => {
      setPendingStream(cfg);
      initVideoDefaults(cfg);
    });

    // ── Video params ──────────────────────────────────────────────────────────
    const videoModal      = document.getElementById('videoModal');
    const videoModalNote  = document.getElementById('videoModalNote');
    const vpResEl         = document.getElementById('vpRes');
    const vpFpsEl         = document.getElementById('vpFps');
    const vpFpsVal        = document.getElementById('vpFpsVal');
    const vpBitrateEl     = document.getElementById('vpBitrate');
    const vpBitrateVal    = document.getElementById('vpBitrateVal');
    const vpBitrateLabel  = document.getElementById('vpBitrateLabel');
    const vpQualityEl     = document.getElementById('vpQuality');
    const vpQualityVal    = document.getElementById('vpQualityVal');
    const vpQualityLabel  = document.getElementById('vpQualityLabel');

    // Loaded from localStorage, then overridden by server defaults if not present
    let videoParams = {};
    try { videoParams = JSON.parse(localStorage.getItem('picar-video') || '{}'); } catch (_) {}

    const RESOLUTIONS = ['320x240', '480x360', '640x480', '1280x720'];

    function closestRes(w, h) {
      const key = `${w}x${h}`;
      return RESOLUTIONS.includes(key) ? key : RESOLUTIONS[1]; // default 480x360
    }

    function initVideoDefaults(cfg) {
      // Only set defaults from server if not already in localStorage
      if (!videoParams.fps     && cfg.fps)     videoParams.fps     = cfg.fps;
      if (!videoParams.width   && cfg.width)   videoParams.width   = cfg.width;
      if (!videoParams.height  && cfg.height)  videoParams.height  = cfg.height;
      if (!videoParams.bitrate && cfg.bitrate) videoParams.bitrate = cfg.bitrate;
      if (!videoParams.quality && cfg.quality) videoParams.quality = cfg.quality;
    }

    function openVideo() {
      commandMenu.style.display = 'none';
      const codec = pendingStreamCfg ? pendingStreamCfg.codec : null;
      const isWebRTC = codec === 'webrtc';
      const isMjpeg  = codec === 'mjpeg';

      videoModalNote.textContent = isWebRTC
        ? 'WebRTC: Apply will update mediamtx.yml and restart MediaMTX (~2 s interruption).'
        : '';

      // Show/hide codec-specific rows
      vpBitrateLabel.style.display = isMjpeg  ? 'none' : '';
      vpBitrateEl.style.display    = isMjpeg  ? 'none' : '';
      vpBitrateVal.style.display   = isMjpeg  ? 'none' : '';
      vpQualityLabel.style.display = !isMjpeg ? 'none' : '';
      vpQualityEl.style.display    = !isMjpeg ? 'none' : '';
      vpQualityVal.style.display   = !isMjpeg ? 'none' : '';

      // Populate sliders from stored params
      const res = closestRes(videoParams.width || 480, videoParams.height || 360);
      vpResEl.value     = res;
      vpFpsEl.value     = videoParams.fps     || 20;
      vpBitrateEl.value = videoParams.bitrate || 350;
      vpQualityEl.value = videoParams.quality || 20;
      updateVideoLabels();

      videoModal.classList.add('open');
    }

    function closeVideo() { videoModal.classList.remove('open'); }

    function updateVideoLabels() {
      vpFpsVal.textContent     = vpFpsEl.value + ' fps';
      vpBitrateVal.textContent = vpBitrateEl.value + ' kbps';
      vpQualityVal.textContent = vpQualityEl.value;
    }

    [vpFpsEl, vpBitrateEl, vpQualityEl].forEach(el =>
      el.addEventListener('input', updateVideoLabels)
    );

    function applyVideo() {
      const [w, h] = vpResEl.value.split('x').map(Number);
      videoParams = {
        width:   w,
        height:  h,
        fps:     Number(vpFpsEl.value),
        bitrate: Number(vpBitrateEl.value),
        quality: Number(vpQualityEl.value),
      };
      localStorage.setItem('picar-video', JSON.stringify(videoParams));
      socket.emit('setVideoParams', videoParams);
      closeVideo();
    }

    // ── Device / control mode ─────────────────────────────────────────────────
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    let controlMode      = isTouchDevice ? 'joystick' : 'keyboard';
    let throttleValue    = 0;
    let steeringValue    = 0;
    let shiftValue       = 1;
    let tlockFrontValue  = 1;
    let tlockRearValue   = -1;
    let controlSendInterval = null;
    // Assigned when the joysticks are wired up further down. Default to no-ops so
    // the drivetrain interlock is safe to call regardless of load order.
    let resetThrottleJoystick = () => {};
    let resetSteeringJoystick = () => {};

    const STEERING_DEADZONE = 0.08;
    const STEERING_EXPO     = 2.0;
    function applyCurve(raw) {
      const sign = Math.sign(raw), abs = Math.abs(raw);
      if (abs < STEERING_DEADZONE) return 0;
      return sign * Math.pow((abs - STEERING_DEADZONE) / (1 - STEERING_DEADZONE), STEERING_EXPO);
    }

    // ── Drivetrain-change interlock ───────────────────────────────────────────
    //
    // A gear or differential change drives a mechanical actuator against the
    // drivetrain. Doing that under power shifts the transmission mid-drive,
    // which is how a gear change ends up fighting an engaged motor. So every
    // drivetrain change first commands neutral and disarms, and the operator
    // must press Start again deliberately. This runs for the on-screen buttons
    // and the keyboard shortcut alike — there must be no path that changes the
    // drivetrain while the vehicle can move.
    // The AUTHORITY for this interlock is the server's 'setDrivetrain' handler,
    // which forces neutral and disarm onto the wire before moving the actuator.
    // This function only does the local half: stop commanding motion, reset the
    // inputs so nothing snaps back when the operator re-arms, and reflect the
    // stopped state in the UI. It deliberately does not decide whether it is
    // safe to shift — a browser cannot know that, and this control plane is
    // unauthenticated so a second tab could disagree.
    function localStopForDrivetrainChange() {
      throttleValue = 0;
      steeringValue = 0;
      resetThrottleJoystick();
      resetSteeringJoystick();
      for (const key of Object.keys(keysDown)) delete keysDown[key];
      stopControlSendLoop();
      stopped = true;
      stopBtn.textContent = 'Start';
      stopBtn.style.background = '#333';
      renderStatusBar();
    }

    // Request a drivetrain change and only update the UI once the server has
    // confirmed it applied. The optimistic-toggle-then-send pattern was wrong:
    // it left the button claiming HIGH when the server had refused.
    function requestDrivetrain(fields, onApplied) {
      localStopForDrivetrainChange();
      if (!isConnected) { showDrivetrainError('not connected'); return; }
      socket.emit('setDrivetrain', fields, (result) => {
        if (result && result.ok) onApplied();
        else showDrivetrainError(result && result.error ? result.error : 'refused');
      });
    }

    function showDrivetrainError(message) {
      stopBtn.title = `Drivetrain change failed: ${message}`;
      stopBtn.textContent = 'Start ⚠';
      console.warn('Drivetrain change failed:', message);
    }

    function toggleShift() {
      const next = shiftValue > 0 ? -1 : 1;
      requestDrivetrain({ shift: next }, () => {
        shiftValue = next;
        const btn = document.getElementById('shiftBtn');
        if (next < 0) { btn.textContent = 'Gear: HIGH'; btn.classList.add('high'); }
        else          { btn.textContent = 'Gear: LOW';  btn.classList.remove('high'); }
      });
    }
    function toggleTlockFront() {
      const next = tlockFrontValue > 0 ? -1 : 1;
      requestDrivetrain({ tlock_front: next }, () => {
        tlockFrontValue = next;
        const btn = document.getElementById('tlockFrontBtn');
        if (next < 0) { btn.textContent = 'F.Diff: Lock'; btn.classList.add('locked'); }
        else          { btn.textContent = 'F.Diff: Open'; btn.classList.remove('locked'); }
      });
    }
    function toggleTlockRear() {
      const next = tlockRearValue < 0 ? 1 : -1;
      requestDrivetrain({ tlock_rear: next }, () => {
        tlockRearValue = next;
        const btn = document.getElementById('tlockRearBtn');
        if (next > 0) { btn.textContent = 'R.Diff: Lock'; btn.classList.add('locked'); }
        else          { btn.textContent = 'R.Diff: Open'; btn.classList.remove('locked'); }
      });
    }

    // ── Light module (Pixhawk output 6) ───────────────────────────────────────
    //
    // Unlike the gear and diff buttons this does NOT go through
    // requestDrivetrain(): a light is not a mechanical actuator working against the
    // driveline, so there is nothing to stop for and forcing a disarm to switch a
    // light on would make the vehicle less usable for no safety gain.
    //
    // The button reflects the SERVER's state, not the click. It updates only when
    // the server acknowledges or broadcasts lightState, so a refused command cannot
    // leave the button claiming ON while the output is off — the same mistake the
    // gear button used to make with its optimistic toggle.
    let lightOn = false;

    function renderLight() {
      const btn = document.getElementById('lightBtn');
      if (!btn) return;
      btn.textContent = `Light: ${lightOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('lit', lightOn);
    }

    function toggleLight() {
      if (!isConnected) { showLightError('not connected'); return; }
      const want = !lightOn;
      socket.emit('setLight', want, (result) => {
        if (result && result.ok) { lightOn = result.on; renderLight(); }
        else showLightError(result && result.error ? result.error : 'refused');
      });
    }

    function showLightError(message) {
      const btn = document.getElementById('lightBtn');
      if (btn) btn.textContent = 'Light: ⚠';
      console.warn('Light command failed:', message);
    }

    // Broadcast, so a second tab or a reconnect shows the real state rather than a
    // stale one.
    socket.on('lightState', (s) => {
      if (!s || typeof s.on !== 'boolean') return;
      lightOn = s.on;
      renderLight();
    });

    function addButtonHandlers(id, toggleFn) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); toggleFn(); }, { passive: false });
      el.addEventListener('click',      (e) => { if (!isTouchDevice) toggleFn(); });
    }
    addButtonHandlers('shiftBtn',      toggleShift);
    addButtonHandlers('tlockFrontBtn', toggleTlockFront);
    addButtonHandlers('tlockRearBtn',  toggleTlockRear);
    addButtonHandlers('lightBtn',      toggleLight);

    function activateControlMode(mode) {
      deactivateAllControls();
      controlMode = mode;
      controlModeBtn.textContent = `Control: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
      joystickLeftEl.style.display  = mode === 'joystick' ? 'block' : 'none';
      joystickRightEl.style.display = mode === 'joystick' ? 'block' : 'none';
      applyKeyboardHintVisibility();
      enableBtn.style.display       = 'none';
      if (mode === 'orientation') requestOrientationPermission();
      renderStatusBar();
    }

    function deactivateAllControls() {
      window.removeEventListener('deviceorientation', handleOrientation, true);
      // Leaving tilt control clears the neutral latch: re-entering it must require the
      // device to be seen at rest again rather than inheriting a stale "it was level once".
      orientationNeutralSeen = false;
      throttleValue = 0; steeringValue = 0;
    }

    function currentSteeringCommand() {
      return controlMode === 'orientation' ? steeringValue : applyCurve(steeringValue);
    }

    // reliable=true opts out of volatile delivery. The periodic 20 Hz stream is
    // volatile on purpose — a dropped frame is superseded 50 ms later. But a
    // neutral command that must land *before* a disarm is not superseded by
    // anything, so it has to be sent reliably or it can be silently discarded.
    function sendControlValues({ reliable = false } = {}) {
      const data = {
        throttle:    throttleValue,
        steering:    currentSteeringCommand(),
        shift:       shiftValue,
        tlock_front: tlockFrontValue,
        tlock_rear:  tlockRearValue,
      };
      statUpBytes += JSON.stringify(data).length;
      if (reliable) socket.emit('fromclient', data);
      else          socket.volatile.emit('fromclient', data);
    }

    function startControlSendLoop() {
      if (controlSendInterval) return;
      sendControlValues();
      controlSendInterval = setInterval(() => { if (!stopped) sendControlValues(); }, 50);
    }
    function stopControlSendLoop() {
      if (!controlSendInterval) return;
      clearInterval(controlSendInterval); controlSendInterval = null;
    }
    function cycleControlMode() {
      const modes = ['joystick', 'keyboard', 'orientation'];
      activateControlMode(modes[(modes.indexOf(controlMode) + 1) % modes.length]);
    }

    // ── Wake lock ─────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
    });

    // ── Menu ──────────────────────────────────────────────────────────────────
    menuBtn.addEventListener('click', () => {
      commandMenu.style.display = commandMenu.style.display === 'block' ? 'none' : 'block';
    });

    // ── Stop / Start ──────────────────────────────────────────────────────────
    function toggleStop() {
      if (!stopped) {
        throttleValue = 0; steeringValue = 0;
        sendControlValues(); stopControlSendLoop();
        socket.emit('disarm');
        stopBtn.textContent = 'Start'; stopBtn.style.background = '#333';
        stopped = true;
      } else {
        socket.emit('arm');
        startControlSendLoop();
        stopBtn.textContent = 'Stop'; stopBtn.style.background = '#a33';
        stopped = false;
      }
      renderStatusBar();
    }

    function refreshPage() { window.location.reload(); }

    // ── Orientation controls ──────────────────────────────────────────────────
    function requestOrientationPermission() {
      if (!window.DeviceOrientationEvent) return;
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') { window.addEventListener('deviceorientation', handleOrientation, true); enableBtn.style.display = 'none'; }
            renderStatusBar();
          })
          .catch(() => renderStatusBar());
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
        enableBtn.style.display = 'none';
      }
    }

    // Tilt neutral: the device is held at 45 degrees, and throttle is the deviation
    // from that over a 50-degree span.
    const ORIENTATION_NEUTRAL_BETA = 45;
    const ORIENTATION_BETA_SPAN    = 50;
    const ORIENTATION_GAMMA_SPAN   = 25;
    // A phone is never perfectly still. Without a dead band, hand tremor of a fraction
    // of a degree commands continuous throttle, and 0.06 is also the flight
    // controller's own RC deadzone (RC3_DZ=30us over a 500us half-span), so anything
    // smaller could not move the vehicle anyway.
    const ORIENTATION_THROTTLE_DZ  = 0.06;

    // Pure, so the rule is testable, and ARGUMENT-TAKING so the test drives the same
    // code the handler does.
    //
    // The bug this replaces: `(45 - betadeg) / 50` with betadeg === null evaluates to
    // 45/50 = 0.9. null coerces to 0 in arithmetic, so a device that fires
    // `deviceorientation` WITHOUT a usable beta reading — Firefox on desktop, Android
    // before its first sensor sample, iOS with the sensor briefly unavailable —
    // commanded 90% FORWARD THROTTLE the instant orientation mode was entered, with no
    // user input at all. On a rover with a flight battery installed that drives away.
    // TASKS.md recorded this entry as a hand-tremor risk; the null path is far worse and
    // needs no tremor.
    //
    // Fails to NEUTRAL, not to a last-known value: an absent sensor reading is not
    // evidence about how the device is being held.
    function orientationToControls(betadeg, gammadeg, neutralSeen) {
      const out = { throttle: 0, steering: 0, valid: true, neutralSeen: !!neutralSeen };
      if (!Number.isFinite(betadeg) || !Number.isFinite(gammadeg)) {
        out.valid = false;
        return out;                      // both axes neutral
      }
      const raw = (ORIENTATION_NEUTRAL_BETA - betadeg) / ORIENTATION_BETA_SPAN;
      const thr = Math.max(-1, Math.min(1, raw));
      const inDeadband = Math.abs(thr) < ORIENTATION_THROTTLE_DZ;

      // NEUTRAL CAPTURE. Removing the null route to 0.9 throttle was not enough: the
      // DESIGN route is still there. beta=0 is a phone lying flat, screen up, and
      // (45-0)/50 = +0.9. So setting the phone on a bench, or handing it to someone, and
      // then pressing Start commanded 90% forward throttle within one 50 ms send tick —
      // with a perfectly working sensor and no operator input. Same symptom, same
      // magnitude, same hazard as the null bug; only the cause differs. A review caught
      // this after the first fix shipped.
      //
      // So throttle stays at zero until the device has been observed at rest — one
      // reading inside the dead band since the last arm. That is an explicit
      // neutral-at-arm requirement, which is what TASKS.md asked for and what the first
      // version of this fix did not deliver.
      //
      // Steering is deliberately NOT latched: it commands no drive, and locking it out
      // would surprise an operator who is trying to straighten the wheels.
      out.neutralSeen = !!neutralSeen || inDeadband;
      out.throttle = (inDeadband || !out.neutralSeen) ? 0 : thr;
      out.steering = Math.max(-1, Math.min(1, gammadeg / ORIENTATION_GAMMA_SPAN));
      return out;
    }

    let orientationWarned = false;
    // Cleared whenever tilt control is left or the vehicle is stopped, so re-arming
    // requires the device to be observed at rest again.
    let orientationNeutralSeen = false;

    function handleOrientation(event) {
      // controlMode is checked as well as `stopped`, matching keyboardTick. Without it
      // there is a real race: requestOrientationPermission() adds this listener from an
      // async .then, so an operator who switches to joystick while the iOS permission
      // prompt is open gets the tilt handler attached AFTER the switch — and phone
      // orientation then commands throttle in joystick mode.
      if (stopped) {
        // Clearing the latch HERE rather than in toggleStop, because this is reachable
        // from a test: a mutation deleting the toggleStop reset survived the whole suite.
        // Orientation events fire at ~60 Hz, so the latch clears within a frame of Stop,
        // and re-arming then requires the device to be seen at rest again.
        orientationNeutralSeen = false;
        return;
      }
      if (controlMode !== 'orientation') return;
      const c = orientationToControls(event.beta, event.gamma, orientationNeutralSeen);
      orientationNeutralSeen = c.neutralSeen;

      // ASSIGNED FIRST, before anything that can throw. A review deleted the
      // `orientationWarned` declaration and the suite stayed green — but in a browser the
      // warn block throws ReferenceError, and with the assignment below it that left the
      // PREVIOUS throttle live at 20 Hz on a transient bad reading. Same reasoning as
      // invariant 6: put the safe value where nothing can jump over it.
      throttleValue = c.throttle;
      steeringValue = applyCurve(c.steering);

      if (!c.valid && !orientationWarned) {
        orientationWarned = true;
        console.warn('deviceorientation fired with no usable beta/gamma reading. ' +
                     'Throttle and steering held at neutral.');
      }
    }

    // ── Virtual joysticks ─────────────────────────────────────────────────────
    function setupJoystick(zoneEl, thumbEl, axis) {
      let active = false, touchId = null;
      const baseRadius = 75, thumbRadius = 25, maxDist = baseRadius - thumbRadius;

      function getCenter() { const r = zoneEl.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }

      function handleMove(cx, cy) {
        const c = getCenter();
        let dx = cx - c.x, dy = cy - c.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxDist) { dx = dx/dist*maxDist; dy = dy/dist*maxDist; }
        thumbEl.style.left = (baseRadius + dx) + 'px';
        thumbEl.style.top  = (baseRadius + dy) + 'px';
        if (axis === 'throttle') throttleValue = -(dy / maxDist);
        else                     steeringValue  =   dx / maxDist;
      }

      function resetThumb() {
        thumbEl.style.left = '50%'; thumbEl.style.top = '50%';
        thumbEl.style.transform = 'translate(-50%, -50%)';
        if (axis === 'throttle') throttleValue = 0; else steeringValue = 0;
      }

      zoneEl.addEventListener('touchstart', (e) => {
        if (active) return;
        const t = e.changedTouches[0]; touchId = t.identifier; active = true;
        thumbEl.style.transform = 'translate(-50%, -50%)';
        handleMove(t.clientX, t.clientY); e.preventDefault();
      }, { passive: false });

      zoneEl.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === touchId) { handleMove(t.clientX, t.clientY); e.preventDefault(); break; }
        }
      }, { passive: false });

      const endTouch = (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === touchId) { active = false; touchId = null; resetThumb(); e.preventDefault(); break; }
        }
      };
      const cancelTouch = (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === touchId) {
            active = false; touchId = null;
            if (axis === 'throttle') console.log('touchcancel throttle — preserved');
            else { resetThumb(); console.log('touchcancel steering — reset'); }
            e.preventDefault(); break;
          }
        }
      };
      zoneEl.addEventListener('touchend',   endTouch,    { passive: false });
      zoneEl.addEventListener('touchcancel', cancelTouch, { passive: false });

      // Expose the reset so a fail-safe stop can also snap the thumb back to
      // centre. Without this the stick renders deflected while the command
      // stream is neutral, which reads to the operator as a stuck control.
      return () => { active = false; touchId = null; resetThumb(); };
    }

    resetThrottleJoystick = setupJoystick(joystickLeftEl,  thumbLeft,  'throttle');
    resetSteeringJoystick = setupJoystick(joystickRightEl, thumbRight, 'steering');

    // ── Keyboard controls ─────────────────────────────────────────────────────
    const keysDown = {};
    const KEY_THROTTLE_STEP = 0.05, KEY_STEERING_STEP = 0.15;

    // The flight controller ignores throttle inside its own RC deadzone. Measured on
    // rover3: RC3_DZ=30us, and the throttle span is 500us per normalised unit
    // (RC3_MIN 1000 / RC3_TRIM 1500 / RC3_MAX 2000, and setServoPWM('throttle', 0.8)
    // puts 1900us on the wire). So 30us = 0.06 units, and a first keyboard step of
    // 0.05 lands INSIDE the deadzone and commands nothing at all. The second tick
    // reaches 0.10 and finally escapes — a dead ~100 ms on every press, which the
    // operator experiences as "reverse doesn't happen immediately".
    //
    // 0.08 leaves a 10us margin over the deadzone rather than sitting on its edge,
    // where trim drift or a different RC3_DZ would put us back inside it.
    const THROTTLE_DEADZONE   = 0.06;
    const THROTTLE_DZ_ESCAPE  = 0.08;

    // One step of the keyboard throttle ramp. Pure and exported-by-extraction so the
    // deadzone-escape rule is testable; the loop below is the only caller.
    //
    // Note this makes the vehicle begin moving on the FIRST tick instead of the third.
