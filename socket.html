    // That is the point — but it IS a change in how quickly a keypress produces motion,
    // so it escapes the deadzone and no further: 0.08 is a crawl, not a launch. The
    // normal ramp takes over from there.
    function nextThrottle(current, direction, step) {
      // RELEASE SNAPS TO NEUTRAL, it does not coast down.
      //
      // This used to decay by one step per tick — from full forward that is a full
      // second before the command reaches zero. Two reasons that was wrong:
      //
      //   1. The ESC gates forward -> reverse. On this vehicle (Traxxas XL-5) the reverse
      //      input while rolling forward is BRAKE; reverse only engages after the throttle
      //      has returned to neutral and is applied again. A one-second decay meant that
      //      pressing reverse during it never presented a clean neutral at all, so reverse
      //      appeared not to work. The operator's workaround was to steer first — which
      //      was really just spending time at neutral while the decay finished.
      //   2. It is the safer direction regardless. Releasing throttle should stop
      //      commanding drive immediately, not a second later, on a vehicle with a pack
      //      installed. Snapping to neutral is a coast, not a reversal, and it is what
      //      releasing a transmitter trigger does.
      //
      // Steering still decays gradually — self-centring is desirable there and no gate
      // depends on it.
      if (direction === 0) return 0;
      const target = current + direction * step;
      // The escape applies ONLY when starting from inside the dead band — that is the
      // situation where the command produces no output at all. An earlier version tested
      // `current > -THROTTLE_DEADZONE` for the reverse case, which is true for ANY
      // forward value, so holding reverse while rolling forward at 0.5 snapped straight
      // to -0.08 instead of decelerating through zero. A test caught it; the condition is
      // now on the MAGNITUDE of current, which is what "inside the deadzone" means.
      if (Math.abs(current) < THROTTLE_DEADZONE) {
        return direction > 0
          // max/min, not a bare assignment: if the ordinary step already clears the
          // deadzone, take it rather than pulling the command back down to the escape.
          ? Math.min(1, Math.max(target, THROTTLE_DZ_ESCAPE))
          : Math.max(-1, Math.min(target, -THROTTLE_DZ_ESCAPE));
      }
      return Math.max(-1, Math.min(1, target));
    }
    let keyboardInterval = null;

    // True when the UI, not the vehicle, should own the keystroke: a modal is
    // open, or focus is inside a form control. Without this, typing or dragging a
    // slider in the Video/Config modals reaches the drive controls.
    function isUiCapturingKeys() {
      if (configModal.classList.contains('open')) return true;
      if (videoModal.classList.contains('open')) return true;
      const el = document.activeElement;
      if (!el) return false;
      return /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(el.tagName) || el.isContentEditable;
    }

    const KEY_TICK_MS = 50;

    function startKeyboardLoop(setIntervalFn = setInterval) {
      if (keyboardInterval) return;
      keyboardInterval = setIntervalFn(keyboardTick, KEY_TICK_MS);
    }

    // One tick of keyboard control. Extracted and argument-free-of-timers on purpose:
    // an adversarial review reverted the three call-site lines that used nextThrottle()
    // — deleting BOTH the deadzone escape and the snap-to-neutral from the only path
    // that runs them — and all 248 tests stayed green. The rule was tested; its consumer
    // was not, which is the defect shape CLAUDE.md names as this repo's dominant one.
    // Tests now drive THIS, and startKeyboardLoop takes its scheduler so the wiring
    // between the two is covered as well.
    function keyboardTick() {
      if (stopped || controlMode !== 'keyboard') return;
      const throttleDir = (keysDown['KeyW'] || keysDown['ArrowUp']) ? 1
                        : (keysDown['KeyS'] || keysDown['ArrowDown']) ? -1 : 0;
      throttleValue = nextThrottle(throttleValue, throttleDir, KEY_THROTTLE_STEP);

      const steerDir = (keysDown['KeyA'] || keysDown['ArrowLeft']) ? -1
                     : (keysDown['KeyD'] || keysDown['ArrowRight']) ? 1 : 0;
      steeringValue = nextSteering(steeringValue, steerDir, KEY_STEERING_STEP);
    }

    // Steering keeps the gradual self-centring decay that throttle deliberately gave up:
    // nothing gates on steering reaching neutral promptly, and a snap would make the
    // wheels jerk straight on key release.
    function nextSteering(current, direction, step) {
      if (direction === 0) {
        if (Math.abs(current) < step) return 0;
        return current - Math.sign(current) * step;
      }
      return Math.max(-1, Math.min(1, current + direction * step));
    }

    document.addEventListener('keydown', (e) => {
      if (controlMode !== 'keyboard') return;
      if (e.code === 'Space') {
        e.preventDefault(); throttleValue = 0; steeringValue = 0;
        // An operator hitting the panic key must not have it dropped.
        sendControlValues({ reliable: true }); return;
      }
      // Gear is on KeyG, not on Shift. A bare modifier is the wrong key for a
      // mechanical gear change: Shift is held while typing, is part of habitual
      // Shift+W "sprint" muscle memory, and auto-repeats as keydown on some
      // platforms — which would toggle the transmission repeatedly.
      //
      // Guarded three ways, because an accidental gear change is a mechanical
      // event: auto-repeat is ignored so holding G shifts once; any modifier is
      // ignored so browser chords like Ctrl/Cmd+G do not shift; and it is ignored
      // while a modal is open or a form control has focus, so adjusting the video
      // sliders cannot shift the transmission.
      if (e.code === 'KeyG') {
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        if (isUiCapturingKeys()) return;
        e.preventDefault();
        toggleShift();
        return;
      }
      if (!keysDown[e.code]) { keysDown[e.code] = true; startKeyboardLoop(); }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    });
    document.addEventListener('keyup', (e) => { delete keysDown[e.code]; });

    // ── Socket status ─────────────────────────────────────────────────────────
    socket.on('telemetry', (t) => { telemetry = t; telemetryAt = Date.now(); renderStatusBar(); });
    socket.on('telemetryConfig', (c) => {
      telemetryCfg = { ...telemetryCfg, ...c };
      // Three missed frames, floor 3 s. Derived from the server's real interval
      // rather than hard-coded, because that key is operator-settable up to 60 s and
      // a fixed window would blank the bar on a deliberately slow rover.
      if (Number.isFinite(c.telemetryIntervalMs)) {
        telemetryStaleMs = Math.max(3000, c.telemetryIntervalMs * 3);
      }
    });
    startTelemetryExpiryWatch(setInterval);
    socket.on('connect',    () => { isConnected = true;  renderStatusBar(); });
    socket.on('disconnect', () => {
      isConnected = false;
      // Clear telemetry too. No further messages arrive, so the server's staleness
      // window cannot help: the bar would keep showing the last battery voltage
      // indefinitely after the link dropped.
      telemetry = null;
      // A dropped link means our commands are no longer reaching the vehicle, so
      // stop claiming to be armed. The operator must re-arm deliberately after a
      // reconnect rather than resuming the previous throttle.
      if (!stopped) localStopForDrivetrainChange();
      renderStatusBar();
    });

    // The server broadcasts this when it forces a stop — including to the tab that
    // did not initiate it, since a drivetrain change disarms the whole vehicle and
    // any other connected controller must stop believing it is armed.
    socket.on('controlStopped', (event) => {
      if (!stopped) localStopForDrivetrainChange();
      stopBtn.title = `Stopped: ${event && event.reason ? event.reason : 'server fail-safe'}`;
      renderStatusBar();
    });

    // ── Startup ───────────────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      requestWakeLock();
      applyButtonVisibility();
      activateControlMode(controlMode);
      renderLight();
      renderStatusBar();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
